
name: Multi-OS Hello World Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  ubuntu-job:
    name: Ubuntu Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Ubuntu Information
        run: |
          echo "Hello World from Ubuntu!"
          echo "Operating System: Linux"
          uname -a

  mac-job:
    name: macOS Pipeline
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display macOS Information
        run: |
          echo "Hello World from macOS!"
          echo "Operating System: macOS"
          sw_vers

  windows-job:
    name: Windows Pipeline
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Windows Information
        run: |
          echo "Hello World from Windows!"
          echo "Operating System: Windows"
          systeminfo
