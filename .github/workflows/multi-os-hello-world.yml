
name: Advanced Multi-OS Docker CI/CD Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:

  multi-os-test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Hello World Test
        run: echo "Hello World CI/CD Test Successful!"

      - name: Display OS Information
        run: |
          echo "Operating System Test Completed"

  docker-build-scan:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: multi-os-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t multi-os-hello-world:latest .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: multi-os-hello-world:latest
          format: table
          output: trivy-report.txt
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Upload Security Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: docker-security-scan-report
          path: trivy-report.txt
